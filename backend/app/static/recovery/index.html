<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Set a new BrassTune password</title>
    <link rel="stylesheet" href="/auth/recovery/recovery.css">
  </head>
  <body>
    <main class="card" aria-labelledby="title">
      <p class="eyebrow">BrassTune</p>
      <h1 id="title">Set a new password</h1>
      <p id="status" role="status" aria-live="polite">Checking your recovery link…</p>
      <form id="recovery-form" hidden novalidate>
        <label for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <label for="password-confirmation">Confirm new password</label>
        <input id="password-confirmation" name="password-confirmation" type="password" autocomplete="new-password" minlength="8" required>
        <button id="submit" type="submit">Update password</button>
      </form>
      <p class="fine-print">This page does not save your recovery session on this device.</p>
    </main>
    <script id="recovery-public-config" type="application/json">__RECOVERY_PUBLIC_CONFIG__</script>
    <script src="/auth/recovery/recovery.js" defer></script>
  </body>
</html>
