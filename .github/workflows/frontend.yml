name: Frontend

on:
  # Persistent self-hosted runners are reserved for trusted revisions. Pull
  # requests are validated locally, then these gates run after merge to main.
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "fixtures/**"
      - "supabase/**"
      - "render.yaml"
      - "vercel.json"
      - "frontend/vercel.json"
      - "scripts/ci/setup-self-hosted-linux.sh"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  test-build-audit:
    runs-on: ${{ fromJSON(vars.BRASSTUNE_FRONTEND_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 75
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Verify selected Python SQLite support
        run: python -c 'import sqlite3; print(sqlite3.sqlite_version)'
      - name: Install dependencies
        run: npm ci
      - name: Install backend dependencies for browser journeys
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements-prod.lock
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev
      - name: Install Playwright browsers and system dependencies
        if: runner.environment != 'self-hosted'
        timeout-minutes: 60
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install Playwright browsers from pre-provisioned self-hosted runtime
        if: runner.environment == 'self-hosted'
        timeout-minutes: 60
        run: npx playwright install chromium firefox webkit
      - name: Browser release journeys
        timeout-minutes: 35
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/brasstune-e2e-${{ github.run_id }}-${{ github.run_attempt }}.db
          E2E_START_LOCAL_SERVERS: "1"
          PLAYWRIGHT_HTML_OPEN: never
        run: npm run e2e:local
      - name: Clean browser journey temp database
        if: always()
        run: rm -f "$RUNNER_TEMP"/brasstune-e2e-*.db*
      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: brass-tune-playwright
          path: |
            frontend/test-results/**
            docs/release-readiness/playwright-report/**
