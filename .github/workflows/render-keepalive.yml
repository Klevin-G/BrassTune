name: Render Keepalive

# Closed-beta helper only: Render Free web services can spin down after idle time.
# This scheduled ping reduces cold starts, but it is not an uptime guarantee.
# For production or public beta, move the Render backend to a paid always-on instance.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      health_url:
        description: Optional Render health URL override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ${{ fromJSON(vars.BRASSTUNE_RENDER_KEEPALIVE_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    env:
      DEFAULT_RENDER_KEEPALIVE_URL: https://brasstune.onrender.com/api/live
      INPUT_HEALTH_URL: ${{ github.event.inputs.health_url }}
      SECRET_HEALTH_URL: ${{ secrets.RENDER_KEEPALIVE_URL }}
      VAR_HEALTH_URL: ${{ vars.RENDER_KEEPALIVE_URL }}
    steps:
      - name: Ping Render liveness endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="${INPUT_HEALTH_URL:-${SECRET_HEALTH_URL:-${VAR_HEALTH_URL:-$DEFAULT_RENDER_KEEPALIVE_URL}}}"

          case "$url" in
            http://*|https://*) ;;
            *)
              echo "RENDER_KEEPALIVE_URL must be an HTTP(S) URL."
              exit 1
              ;;
          esac

          echo "::add-mask::$url"
          curl --fail --show-error --silent \
            --retry 2 \
            --retry-delay 10 \
            --connect-timeout 10 \
            --max-time 70 \
            "$url" >/dev/null
          echo "Render liveness endpoint responded."
