name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      web_base_url:
        description: Web app base URL
        required: false
        default: https://brass-tune.vercel.app
        type: string
      api_base_url:
        description: Backend API base URL
        required: false
        default: https://brasstune.onrender.com
        type: string
      ws_base_url:
        description: Backend WebSocket base URL
        required: false
        default: wss://brasstune.onrender.com
        type: string
permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRASSTUNE_WEB_BASE_URL: ${{ github.event.inputs.web_base_url || vars.BRASSTUNE_WEB_BASE_URL || 'https://brass-tune.vercel.app' }}
      BRASSTUNE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.BRASSTUNE_API_BASE_URL || 'https://brasstune.onrender.com' }}
      BRASSTUNE_WS_BASE_URL: ${{ github.event.inputs.ws_base_url || vars.BRASSTUNE_WS_BASE_URL || 'wss://brasstune.onrender.com' }}
      BRASSTUNE_WEB_ACCESS_URL: ${{ vars.BRASSTUNE_WEB_ACCESS_URL }}
      BRASSTUNE_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.BRASSTUNE_VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run hosted production smoke
        run: npm run smoke:hosted
