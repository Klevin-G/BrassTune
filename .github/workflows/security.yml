name: Security

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "fixtures/**"
      - "supabase/**"
      - "render.yaml"
      - "vercel.json"
      - "frontend/vercel.json"
      - ".github/workflows/security.yml"
  push:
    branches: [main, swift-migration]
    paths:
      - "backend/**"
      - "frontend/**"
      - "fixtures/**"
      - "supabase/**"
      - "render.yaml"
      - "vercel.json"
      - "frontend/vercel.json"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-and-secrets:
    runs-on: ${{ fromJSON(vars.BRASSTUNE_SECURITY_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Frontend audit
        working-directory: frontend
        run: npm ci && npm audit --omit=dev
      - name: Backend dependency audit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock
          pip-audit -r requirements-dev.lock
      - name: Bandit backend scan
        working-directory: backend
        run: |
          bandit -r app -x app/tests
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
