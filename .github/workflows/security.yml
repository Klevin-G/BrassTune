name: Security

on:
  pull_request:
  push:
    branches: [main, swift-migration]
  workflow_dispatch:

jobs:
  dependency-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Frontend audit
        working-directory: frontend
        run: npm ci && npm audit --omit=dev
      - name: Backend dependency audit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          # These Starlette advisories currently list fixed versions outside FastAPI's
          # supported Starlette range. Keep the ignores exact so new advisories fail CI.
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln GHSA-wqp7-x3pw-xc5r \
            --ignore-vuln GHSA-x746-7m8f-x49c \
            --ignore-vuln GHSA-82w8-qh3p-5jfq \
            --ignore-vuln GHSA-jp82-jpqv-5vv3
      - name: Bandit backend scan
        working-directory: backend
        run: |
          python -m pip install bandit
          bandit -r app -x app/tests
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
