name: Security

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "fixtures/**"
      - "supabase/**"
      - "render.yaml"
      - "vercel.json"
      - "frontend/vercel.json"
      - ".github/workflows/security.yml"
  push:
    branches: [main, swift-migration]
    paths:
      - "backend/**"
      - "frontend/**"
      - "fixtures/**"
      - "supabase/**"
      - "render.yaml"
      - "vercel.json"
      - "frontend/vercel.json"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-and-secrets:
    runs-on: ${{ fromJSON(vars.BRASSTUNE_SECURITY_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Frontend audit
        working-directory: frontend
        run: npm ci && npm audit --omit=dev
      - name: Backend dependency audit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c constraints.txt
          pip-audit -r requirements.txt -r requirements-dev.txt
      - name: Bandit backend scan
        working-directory: backend
        run: |
          bandit -r app -x app/tests
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
