name: Security

on:
  # Persistent self-hosted runners are reserved for trusted revisions. Pull
  # requests are validated locally, then these gates run after every merge to
  # main so secret scanning cannot be bypassed by changing an excluded path.
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  dependency-and-secrets:
    runs-on: ${{ fromJSON(vars.BRASSTUNE_SECURITY_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            .github/tools/vercel-cli/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Frontend audit
        working-directory: frontend
        run: npm ci && npm audit --omit=dev
      - name: Vercel deployment tool audit
        run: |
          npm ci --prefix .github/tools/vercel-cli --ignore-scripts
          npm audit --omit=dev --prefix .github/tools/vercel-cli
      - name: Backend dependency audit
        working-directory: backend
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          pip-audit -r requirements-dev.lock
      - name: Bandit backend scan
        working-directory: backend
        run: |
          bandit -r app -x app/tests
      - name: Gitleaks trusted-main merge scan
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            aarch64|arm64)
              asset="gitleaks_8.24.3_linux_arm64.tar.gz"
              expected_sha="5f2edbe1f49f7b920f9e06e90759947d3c5dfc16f752fb93aaafc17e9d14cf07"
              ;;
            x86_64|amd64)
              asset="gitleaks_8.24.3_linux_x64.tar.gz"
              expected_sha="9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          zero_sha="0000000000000000000000000000000000000000"
          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || [[ "$BEFORE_SHA" == "$zero_sha" ]] \
            || [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing to run Gitleaks without a complete push range." >&2
            exit 1
          fi
          git cat-file -e "${BEFORE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git merge-base --is-ancestor "$BEFORE_SHA" "$HEAD_SHA"
          test "$(git rev-list --count "${BEFORE_SHA}..${HEAD_SHA}")" -gt 0

          archive="$RUNNER_TEMP/$asset"
          bin_dir="$RUNNER_TEMP/gitleaks-8.24.3"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/$asset"
          printf '%s  %s\n' "$expected_sha" "$archive" | sha256sum --check --strict -
          mkdir -p "$bin_dir"
          tar --extract --gzip --file "$archive" --directory "$bin_dir" gitleaks
          "$bin_dir/gitleaks" git \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks-results.sarif" \
            --verbose \
            --log-opts="--full-history --diff-merges=first-parent ${BEFORE_SHA}..${HEAD_SHA}" \
            "$GITHUB_WORKSPACE"
      - name: Upload redacted Gitleaks report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-results-${{ github.sha }}
          path: ${{ runner.temp }}/gitleaks-results.sarif
          if-no-files-found: error
          retention-days: 7
