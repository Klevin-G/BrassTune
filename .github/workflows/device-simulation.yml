name: Device Simulation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

jobs:
  simulate-devices:
    runs-on: ${{ fromJSON(vars.BRASSTUNE_DEVICE_SIMULATION_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run device simulation
        working-directory: frontend
        run: npm run simulate:devices
      - name: Upload device simulation artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brass-tune-device-simulation
          path: |
            docs/device-simulation-report.md
            docs/assets/device-simulation/**
