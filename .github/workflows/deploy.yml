name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Service to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - frontend
          - backend

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-frontend:
    if: ${{ github.ref == 'refs/heads/main' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend') }}
    runs-on: ${{ fromJSON(vars.BRASSTUNE_DEPLOY_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_WS_BASE_URL: ${{ secrets.VITE_WS_BASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_AUTH_GOOGLE_ENABLED: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Vercel CLI
        run: npm install -g vercel@54.14.0
      - name: Clear pre-existing Vercel artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- .vercel
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Sync required Vercel production environment
        shell: bash
        run: |
          set -euo pipefail

          sync_variable() {
            local name="$1"
            local value="$2"

            if [[ -z "$value" ]]; then
              echo "::error::${name} is missing or empty in the GitHub Production environment."
              return 1
            fi

            if ! printf '%s\n' "$value" | vercel env add "$name" production \
              --force --no-sensitive --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1; then
              echo "::error::Failed to synchronize ${name} to Vercel Production."
              return 1
            fi
          }

          sync_variable VITE_API_BASE_URL "$VITE_API_BASE_URL"
          sync_variable VITE_WS_BASE_URL "$VITE_WS_BASE_URL"
          sync_variable VITE_SUPABASE_URL "$VITE_SUPABASE_URL"
          sync_variable VITE_SUPABASE_PUBLISHABLE_KEY "$VITE_SUPABASE_PUBLISHABLE_KEY"
          sync_variable VITE_AUTH_GOOGLE_ENABLED "$VITE_AUTH_GOOGLE_ENABLED"
      - name: Refresh Vercel production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Validate production frontend environment
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const envPath = '.vercel/.env.production.local';
          if (!fs.existsSync(envPath)) {
            console.error(`::error file=${envPath}::Vercel production environment was not pulled.`);
            process.exit(1);
          }

          const values = new Map();
          for (const line of fs.readFileSync(envPath, 'utf8').split(/\r?\n/)) {
            const match = line.match(/^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=(.*)$/);
            if (!match) continue;

            let value = match[2].trim();
            const quote = value[0];
            if ((quote === '"' || quote === "'") && value.at(-1) === quote) {
              value = value.slice(1, -1);
            }
            values.set(match[1], value.trim());
          }

          const required = [
            'VITE_API_BASE_URL',
            'VITE_WS_BASE_URL',
            'VITE_SUPABASE_URL',
            'VITE_SUPABASE_PUBLISHABLE_KEY',
            'VITE_AUTH_GOOGLE_ENABLED',
          ];
          const missingOrEmpty = required.filter((name) => !values.get(name));
          let failed = false;

          if (missingOrEmpty.length > 0) {
            console.error(
              `::error file=${envPath}::Missing or empty required Vercel Production variables: ${missingOrEmpty.join(', ')}`,
            );
            failed = true;
          }

          if (values.has('VITE_AUTH_GOOGLE_ENABLED') && values.get('VITE_AUTH_GOOGLE_ENABLED') !== 'true') {
            console.error(
              `::error file=${envPath}::VITE_AUTH_GOOGLE_ENABLED must equal true in Vercel Production.`,
            );
            failed = true;
          }

          if (failed) process.exit(1);
          console.log('Verified required Vercel Production frontend variables without exposing values.');
          NODE
      - name: Build frontend
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy frontend
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Remove Vercel environment artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- .vercel

  deploy-backend:
    if: ${{ github.ref == 'refs/heads/main' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'backend') }}
    runs-on: ${{ fromJSON(vars.BRASSTUNE_DEPLOY_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    environment: production
    env:
      BRASSTUNE_API_BASE_URL: ${{ vars.BRASSTUNE_API_BASE_URL || 'https://brasstune-u8qj.onrender.com' }}
      BRASSTUNE_EXPECTED_BACKEND_SHA: ${{ github.sha }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      BRASSTUNE_DELETION_TOMBSTONE_SECRET: ${{ secrets.BRASSTUNE_DELETION_TOMBSTONE_SECRET }}
      BRASSTUNE_RENDER_PYTHON_VERSION: "3.11.15"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Disable Render auto-deploy
        run: |
          curl --max-time 30 --retry 2 --retry-all-errors --fail-with-body --silent --show-error \
            --request PATCH \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"autoDeploy":"no"}' \
            --output /dev/null
      - name: Synchronize deletion tombstone key to Render
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys

          value = os.environ.get("BRASSTUNE_DELETION_TOMBSTONE_SECRET", "")
          if len(value.encode("utf-8")) < 32:
              print("::error::BRASSTUNE_DELETION_TOMBSTONE_SECRET must be a stable secret of at least 32 bytes.")
              sys.exit(1)
          PY
          python - <<'PY' | curl --max-time 30 --retry 2 --retry-all-errors --fail-with-body --silent --show-error \
            --request PUT \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/BRASSTUNE_DELETION_TOMBSTONE_SECRET" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data-binary @- \
            --output /dev/null
          import json
          import os

          print(json.dumps({"value": os.environ["BRASSTUNE_DELETION_TOMBSTONE_SECRET"]}))
          PY
          echo "Synchronized the dedicated deletion tombstone key without exposing its value."
      - name: Pin Render Python version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | curl --max-time 30 --retry 2 --retry-all-errors --fail-with-body --silent --show-error \
            --request PUT \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/PYTHON_VERSION" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data-binary @- \
            --output /dev/null
          import json
          import os

          print(json.dumps({"value": os.environ["BRASSTUNE_RENDER_PYTHON_VERSION"]}))
          PY
          echo "Pinned the Render Python runtime to ${BRASSTUNE_RENDER_PYTHON_VERSION}."
      - name: Remove legacy Render CORS regex variables
        shell: bash
        run: |
          set -euo pipefail

          delete_render_env_var() {
            local key="$1"
            local status

            if ! status="$(curl --max-time 30 --retry 2 --retry-all-errors --silent --show-error \
              --request DELETE \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${key}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --output /dev/null \
              --write-out '%{http_code}')"; then
              echo "::error::Render request failed while deleting ${key}."
              return 1
            fi

            case "$status" in
              204)
                echo "Deleted legacy Render environment variable ${key}."
                ;;
              404)
                echo "Legacy Render environment variable ${key} was already absent."
                ;;
              *)
                echo "::error::Render refused to delete ${key} (HTTP ${status})."
                return 1
                ;;
            esac
          }

          delete_render_env_var BRASSTUNE_ALLOW_CORS_REGEX
          delete_render_env_var CORS_ALLOWED_ORIGIN_REGEX
      - name: Trigger exact Render deploy
        run: |
          curl --max-time 30 --retry 2 --retry-all-errors --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"commitId\":\"${GITHUB_SHA}\",\"clearCache\":\"do_not_clear\"}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Wait for Render backend release
        run: npm run wait:backend-release
