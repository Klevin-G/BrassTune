name: Account Deletion Retry

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: account-deletion-retry
  cancel-in-progress: false

jobs:
  retry:
    name: trigger-retry-executor
    if: ${{ github.ref == 'refs/heads/main' }}
    # Fail closed to the curl-only maintenance runner. This runner has one
    # no-default-labels label and cannot receive general CI jobs.
    runs-on: ${{ fromJSON(vars.BRASSTUNE_ACCOUNT_DELETION_RETRY_RUNNER || '["brasstune-production-maintenance"]') }}
    timeout-minutes: 5
    environment: production
    env:
      BRASSTUNE_API_BASE_URL: ${{ vars.BRASSTUNE_API_BASE_URL || 'https://brasstune-u8qj.onrender.com' }}
    steps:
      - name: Trigger account deletion retry executor
        shell: bash
        env:
          BRASSTUNE_ACCOUNT_DELETION_RETRY_SECRET: ${{ secrets.BRASSTUNE_ACCOUNT_DELETION_RETRY_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BRASSTUNE_ACCOUNT_DELETION_RETRY_SECRET:-}" ]; then
            echo "BRASSTUNE_ACCOUNT_DELETION_RETRY_SECRET is not configured."
            exit 1
          fi
          if [ "${BRASSTUNE_API_BASE_URL%/}" != "https://brasstune-u8qj.onrender.com" ]; then
            echo "BRASSTUNE_API_BASE_URL must be the approved Render production host before sending the maintenance secret."
            exit 1
          fi
          curl --fail --show-error --silent \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST \
            -H "X-BrassTune-Maintenance-Secret: ${BRASSTUNE_ACCOUNT_DELETION_RETRY_SECRET}" \
            "${BRASSTUNE_API_BASE_URL%/}/api/maintenance/account-deletions/retry"
