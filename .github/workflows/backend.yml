name: Backend

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "fixtures/**"
      - "supabase/**"
      - "render.yaml"
      - ".github/workflows/backend.yml"
  push:
    branches: [main, swift-migration]
    paths:
      - "backend/**"
      - "fixtures/**"
      - "supabase/**"
      - "render.yaml"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ fromJSON(vars.BRASSTUNE_BACKEND_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run pytest
        run: python -m pytest

  postgresql-integration:
    runs-on: ${{ fromJSON(vars.BRASSTUNE_POSTGRES_RUNNER || vars.BRASSTUNE_BACKEND_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: brasstune_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: local
      BRASSTUNE_AUTH_MODE: disabled
      BRASSTUNE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/brasstune_test
      BRASSTUNE_SEED_DEMO_DATA: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Apply Supabase migrations
        run: |
          python - <<'PY'
          from pathlib import Path
          import psycopg
          from psycopg import sql

          migrations_dir = Path("../supabase/migrations")
          with psycopg.connect("postgresql://postgres:postgres@localhost:5432/brasstune_test", autocommit=True) as conn:
              with conn.cursor() as cur:
                  for role in ("anon", "authenticated", "service_role"):
                      cur.execute(
                          "select 1 from pg_roles where rolname = %s",
                          (role,),
                      )
                      if cur.fetchone() is None:
                          cur.execute(sql.SQL("create role {} nologin").format(sql.Identifier(role)))
                  cur.execute("create schema if not exists storage")
                  cur.execute(
                      "create table if not exists storage.buckets "
                      "(id text primary key, name text not null, public boolean not null default false)"
                  )
                  for path in sorted(migrations_dir.glob("*.sql")):
                      print(f"Applying {path.name}")
                      cur.execute(path.read_text())
          PY
      - name: Validate PostgreSQL readiness
        env:
          BRASSTUNE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/brasstune_test
        run: python -m app.db.scrub_deletion_privacy && python -m app.db.check_ready
      - name: Run pytest against PostgreSQL
        run: python -m pytest
