# Supabase config reference for BrassTune (project ref: yznziwewxrlwnwiynlvl).
# Apply the auth URL settings + provider secrets in the Supabase dashboard
# (Authentication → URL Configuration / Providers) or via `supabase config push`.

project_id = "yznziwewxrlwnwiynlvl"

[auth]
enable_signup = true
site_url = "https://brasstune.vercel.app"
additional_redirect_urls = [
  "https://brasstune.vercel.app/auth/callback",
  "https://brasstune.vercel.app/auth/reset-password",
  # Vercel previews are restricted to the owner account suffix. Never use a
  # blanket *.vercel.app callback: other users can create matching hosts.
  "https://*-kelvis-prject.vercel.app/auth/callback",
  "https://*-kelvis-prject.vercel.app/auth/reset-password",
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/auth/reset-password",
  # Native Google OAuth returns only to the matching production/development
  # reverse-domain schemes and path. The bounded state wildcard lets each
  # ASWebAuthenticationSession validate its own cryptographic state before
  # exchanging the PKCE authorization code.
  "com.brasstune.auth://oauth/google\\?state=*",
  "com.brasstune.auth.dev://oauth/google\\?state=*",
]
jwt_expiry = 3600

# Preserve current live behavior: email signup on, email confirmation required,
# and the original (safer) OTP rate limit + length.
[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

# Preserve MFA TOTP (was enabled on the remote before config sync).
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Google OAuth — the frontend already calls signInWithOAuth({provider:'google'}).
# Create a Google Cloud "Web application" OAuth client with authorized redirect
# URI https://yznziwewxrlwnwiynlvl.supabase.co/auth/v1/callback, then set these.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

# Apple web OAuth and native ID-token sign-in share this provider. Supabase uses
# the first client ID for web OAuth and accepts every listed App ID as a native
# token audience. The rotating Apple client-secret JWT must be provided through
# the environment and must never be committed.
[auth.external.apple]
enabled = true
client_id = "com.aryasalem.BrassTune.web,com.aryasalem.BrassTune,com.aryasalem.BrassTune.dev"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"
