services:
  - type: web
    name: brasstune-backend
    runtime: python
    plan: free
    autoDeployTrigger: off
    rootDir: backend
    buildCommand: pip install --require-hashes -r requirements-prod.lock
    startCommand: python -m app.db.scrub_deletion_privacy && python -m app.db.check_ready && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers --ws-max-size 262144 --ws-max-queue 16 --limit-concurrency 100 --backlog 128
    healthCheckPath: /api/live
    envVars:
      - key: APP_ENV
        value: production
      - key: BRASSTUNE_AUTH_MODE
        value: supabase
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_REGEX
        sync: false
      - key: BRASSTUNE_TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        value: https://brasstune-u8qj.onrender.com
      - key: BRASSTUNE_DATABASE_URL
        sync: false
      - key: BRASSTUNE_RELEASE_SHA
        sync: false
      - key: BRASSTUNE_ACCOUNT_DELETION_RETRY_SECRET
        sync: false
      - key: BRASSTUNE_DELETION_TOMBSTONE_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SESSION_AUDIO_STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: session-audio
